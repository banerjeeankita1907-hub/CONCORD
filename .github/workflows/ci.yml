name: CONCORD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (no third-party runtime dependencies)
        run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Unit and regression tests
        run: npm test
      - name: Reproducible experiments
        run: npm run experiment
      - name: CLI smoke test
        run: npm run verify:examples

  formal-cross-check:
    name: TLA+ escrow invariant cross-check (Apalache 0.63.0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Download and verify pinned Apalache release
        env:
          APALACHE_SHA256: a756e96af249bf33cd7629667a49472cb26ac8227c48583da139b414834d59df
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/apalache-mc/apalache/releases/download/v0.63.0/apalache-0.63.0.tgz \
            --output "$RUNNER_TEMP/apalache.tgz"
          echo "$APALACHE_SHA256  $RUNNER_TEMP/apalache.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/apalache"
          tar -xzf "$RUNNER_TEMP/apalache.tgz" -C "$RUNNER_TEMP/apalache" --strip-components=1
      - name: Check initial escrow invariant
        working-directory: formal
        run: |
          "$RUNNER_TEMP/apalache/bin/apalache-mc" check --init=Init --inv=InductiveInvariant --length=0 EscrowCounter.tla
      - name: Check escrow invariant is inductive
        working-directory: formal
        run: |
          "$RUNNER_TEMP/apalache/bin/apalache-mc" check --init=InductiveInvariant --inv=InductiveInvariant --length=1 --no-deadlock EscrowCounter.tla
      - name: Bounded execution cross-check
        working-directory: formal
        run: |
          "$RUNNER_TEMP/apalache/bin/apalache-mc" check --init=Init --next=Next --length=4 --inv=TypeOK,Conservation,GlobalBound --no-deadlock EscrowCounter.tla
