name: CONCORD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (no third-party runtime dependencies)
        run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Unit and regression tests
        run: npm test
      - name: Reproducible experiments
        run: npm run experiment
      - name: CLI smoke test
        run: npm run verify:examples

  formal-cross-check:
    name: TLA+ escrow invariant cross-check (Apalache 0.63.0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Verify finite escrow specification
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/formal:/var/apalache" \
            ghcr.io/apalache-mc/apalache:0.63.0 \
            check --length=4 --inv=TypeOK,Conservation,GlobalBound --no-deadlock EscrowCounter.tla
