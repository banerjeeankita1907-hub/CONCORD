name: CONCORD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (no third-party runtime dependencies)
        run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Unit and regression tests
        run: npm test
      - name: Reproducible experiments
        run: npm run experiment
      - name: CLI smoke test
        run: npm run verify:examples
